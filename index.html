<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f2" />
    <title>Шифры Цезаря и Атбаш</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1 class="heading">Шифры в действии</h1>
      <div class="cipher-picker" role="group" aria-label="Выбор шифра">
        <button class="mode" id="caesar-choice" type="button" aria-pressed="true">Цезарь</button>
        <button class="mode" id="atbash-choice" type="button" aria-pressed="false">Атбаш</button>
      </div>
      <p class="cipher-description" id="cipher-description">Цезарь: каждая буква сдвигается по алфавиту на выбранное число позиций.</p>

      <section class="card" aria-label="Преобразование текста">
        <div class="toolbar">
          <div class="modes" role="group" aria-label="Режим">
            <button
              class="mode"
              id="encrypt"
              type="button"
              aria-pressed="true"
            >
              Зашифровать
            </button>
            <button
              class="mode"
              id="decrypt"
              type="button"
              aria-pressed="false"
            >
              Расшифровать
            </button>
          </div>

          <div class="shift">
            <span class="shift-label">Сдвиг</span>
            <input
              class="range"
              id="range"
              type="range"
              min="0"
              max="32"
              value="3"
              aria-label="Сдвиг"
            />
            <input
              class="num"
              id="number"
              type="number"
              min="0"
              max="32"
              value="3"
              aria-label="Число сдвига"
            />
          </div>
        </div>

        <div class="workspace">
          <div class="pane">
            <div class="pane-head">
              <label class="pane-title" for="source">Исходный текст</label>
            </div>
            <textarea
              class="text-box"
              id="source"
              placeholder="Введите текст"
              spellcheck="false"
            ></textarea>
          </div>

          <div class="flow" aria-hidden="true"><span>→</span></div>

          <div class="pane">
            <div class="pane-head">
              <label class="pane-title" for="result">Результат</label>
            </div>
            <textarea
              class="text-box output"
              id="result"
              readonly
              placeholder="Здесь появится результат"
              aria-live="polite"
            ></textarea>
          </div>
        </div>

        <div class="bottom">
          <button class="clear" id="clear" type="button">Очистить</button>
          <span class="status" id="status" role="status" aria-live="polite"></span>
          <button class="copy" id="start" type="button">
            Начать
          </button>
        </div>
      </section>
    </main>

    <script src="cipher.js" defer></script>
    <script src="atbash.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
